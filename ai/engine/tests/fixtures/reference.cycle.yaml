    abort_criteria: FP rate on web-pricing-page > 0.001 over 30min, or p95 latency delta > 15ms
    started: '2026-06-08T02:00:00Z'
    completed: '2026-06-08T06:00:00Z'
    aborted: false
  - name: region
    scope: EU edge, all unauthenticated traffic
    abort_criteria: Any partner block event, or origin 5xx rate above baseline + 0.5pp
    started: '2026-06-08T06:00:00Z'
    completed: '2026-06-09T00:00:00Z'
    aborted: false
  - name: full
    scope: Global
    abort_criteria: Any partner block event, or support ticket rate +20% over trailing 7d mean
    started: '2026-06-09T02:00:00Z'
    completed: '2026-06-09T14:00:00Z'
    aborted: false
  dashboards_live:
