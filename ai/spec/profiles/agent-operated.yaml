id: agent-operated
name: Agent-operated
description: >
  Use this the moment an agent participates in the cycle. It promotes the two gates
  that convert agent good behaviour from a promise into a verifiable fact: the audit
  chain and cryptographic signatures.

  If an agent is drafting your artifacts and a human is signing off on its work, and
  you are not running at least this profile, you are trusting a language model's
  self-report on the one question that matters most.
severity_overrides:
  X-1: blocking
  X-2: blocking
  X-3: blocking
options:
  # Deliberately NOT strict. X-3 blocking means a source that a working resolver
  # cannot find is a failure, which is the fabrication case the gate exists for.
  # It does NOT mean you must first stand up a telemetry backend: a system with no
  # registered resolver is an operator gap, reported as "not applicable" rather
  # than failed, because you cannot detect a lie about a system you have no way to
  # reach and blocking on it punishes the wrong party.
  #
  # Wire up resolvers for the systems you actually use, then move to `regulated`.
  strict_resolvers: false
