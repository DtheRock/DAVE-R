id: regulated
name: Regulated
description: >
  Everything blocking, and every observed value must be re-runnable: a telemetry
  system with no registered resolver fails the cycle rather than being reported as
  a gap. This is the profile that genuinely requires a resolver per telemetry
  system, so adopt it once you have wired them up, not before.
severity_overrides:
  X-1: blocking
  X-2: blocking
  X-3: blocking
  D-8: blocking
  A-7: blocking
  V-8: blocking
  R-7: blocking
options:
  strict_resolvers: true
  tolerance: 0.02
