id: a-edge-waf
name: Module A - Edge and WAF Expansion
purpose: Expand edge protection without breaking business traffic.

planes: [edge, waf, bot-management]

telemetry_systems: [cloudflare, akamai, fastly, aws-waf, datadog, splunk, elastic, bigquery]

min_shadow_days:
  planned: 7
  expedited: 2
  emergency: 0.25
backfill_window_days: 5

signal_vocabulary:
  - request_rate_per_ip
  - request_rate_per_asn
  - request_rate_per_session
  - ja3_ja4_fingerprint
  - tls_fingerprint_mismatch
  - user_agent_class
  - header_order_anomaly
  - path_entropy
  - referer_absence
  - cookie_absence
  - datacenter_asn

discovery:
  description: What an agent reads before asking a human anything.
  sources:
    - kind: iac
      globs: ["**/*.tf", "**/*.tfvars", "**/waf*.yaml", "**/cloudflare*.yaml"]
      extracts: [existing_rules, rate_limits, enforcement_modes, rollback_toggles]
    - kind: config
      globs: ["**/ruleset*.json", "**/firewall*.json", "**/.well-known/*"]
      extracts: [rule_ids, naming_convention, overlays]
    - kind: api
      system: cloudflare
      calls: [list_firewall_rules, list_rate_limits, list_managed_rulesets, get_analytics]
      extracts: [live_rules, current_enforcement_mode, block_volume, current_latency]
    - kind: repo
      globs: ["**/openapi*.y*ml", "**/routes/**", "**/*.http"]
      extracts: [endpoint_inventory, authenticated_vs_public]
    - kind: vcs
      extracts: [rule_change_history, incident_reverts, mean_time_to_rollback]
  infers:
    - definition_brief.asset.target
    - definition_brief.asset.critical_flows
    - control_matrix.controls[].rollback.procedure
    - control_matrix.controls[].telemetry.source
    - refinement_log.complexity_trend.control_count
  must_ask_human:
    - definition_brief.guardrails.false_positive_tolerance
    - definition_brief.guardrails.latency_budget_ms
    - definition_brief.triage.track
    - definition_brief.raci.accountable
    - definition_brief.non_goals

gates:
  - id: A-A1
    name: critical-flows-explicitly-exempted-or-tested
    severity: blocking
    rationale: >
      The most common self-inflicted outage in edge work is a broad rule that catches a
      checkout or login path nobody mapped. Enumerating them in Define is only useful if
      Validate proves each one was exercised.
    assert:
      each:
        in: definition_brief.asset.critical_flows
        satisfies:
          any_in:
            collection: validation_plan.tests
            where: { eq: [item.covers_critical_flow, outer.id] }
    remediation: Add a safety test per critical flow that exercises the real path end to end.

  - id: A-A2
    name: rule-naming-convention
    severity: advisory
    rationale: Modular, named, explainable units scale; mega-rules do not. Naming is what makes a rule retirable two years later.
    assert:
      each:
        in: control_matrix.controls
        satisfies: { matches: [item.id, "^[A-Z]{2,4}-[A-Z0-9]{2,4}-[0-9]{2}$"] }
    remediation: Adopt a stable rule ID convention such as WAF-RL-01, BOT-CH-02.

  - id: A-A3
    name: log-first-progression
    severity: blocking
    rationale: The module's core discipline, made checkable. Enforcement is reached through log and simulate, not jumped to.
    assert:
      implies:
        - in: [definition_brief.triage.track, [planned, expedited]]
        - in: [validation_plan.shadow.mode, [log-only, shadow, simulate, preview]]
    remediation: Run the control in log-only or simulate mode before any enforcing mode.
