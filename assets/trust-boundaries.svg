<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img"
     aria-label="Trust boundaries from internet through edge, API gateway and origin to the data store, showing which enforcement plane acts at each boundary and where authentication begins.">
  <rect width="900" height="320" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <text x="450" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Trust boundaries and enforcement planes</text>
    <text x="450" y="55" text-anchor="middle" font-size="11.5" fill="#64748b">every control names the boundary it defends and the plane it acts on</text>

    <rect x="28" y="96" width="140" height="86" rx="8" fill="#fff5f5" stroke="#fca5a5" stroke-width="2"/>
    <text x="98" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">Internet</text>
    <text x="98" y="148" text-anchor="middle" font-size="11" fill="#7f1d1d">untrusted</text>
    <text x="98" y="163" text-anchor="middle" font-size="11" fill="#7f1d1d">unauthenticated</text>

    <path d="M172 139 h34" stroke="#64748b" stroke-width="2" marker-end="url(#b)"/>
    <text x="189" y="128" text-anchor="middle" font-size="10" fill="#475569">B1</text>

    <rect x="210" y="96" width="140" height="86" rx="8" fill="#fff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="280" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">Edge / WAF</text>
    <text x="280" y="148" text-anchor="middle" font-size="11" fill="#64748b">rate limits, bot</text>
    <text x="280" y="163" text-anchor="middle" font-size="11" fill="#64748b">management</text>

    <path d="M354 139 h34" stroke="#64748b" stroke-width="2" marker-end="url(#b)"/>
    <text x="371" y="128" text-anchor="middle" font-size="10" fill="#475569">B2</text>

    <rect x="392" y="96" width="140" height="86" rx="8" fill="#fff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="462" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">API gateway</text>
    <text x="462" y="142" text-anchor="middle" font-size="11" fill="#64748b">identity, per-key</text>
    <text x="462" y="157" text-anchor="middle" font-size="11" fill="#64748b">quota</text>

    <path d="M536 139 h34" stroke="#64748b" stroke-width="2" marker-end="url(#b)"/>
    <text x="553" y="128" text-anchor="middle" font-size="10" fill="#475569">B3</text>

    <rect x="574" y="96" width="130" height="86" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="639" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Origin</text>
    <text x="639" y="148" text-anchor="middle" font-size="11" fill="#64748b">application</text>
    <text x="639" y="163" text-anchor="middle" font-size="11" fill="#64748b">authorization</text>

    <path d="M708 139 h32" stroke="#64748b" stroke-width="2" marker-end="url(#b)"/>
    <text x="724" y="128" text-anchor="middle" font-size="10" fill="#475569">B4</text>

    <rect x="744" y="96" width="128" height="86" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <text x="808" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Data</text>
    <text x="808" y="148" text-anchor="middle" font-size="11" fill="#166534">confidential /</text>
    <text x="808" y="163" text-anchor="middle" font-size="11" fill="#166534">regulated</text>

    <path d="M392 208 h480" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M392 202 v12" stroke="#22c55e" stroke-width="2"/>
    <text x="632" y="226" text-anchor="middle" font-size="11.5" fill="#15803d" font-weight="600">authenticated from here</text>

    <path d="M28 208 h340" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M368 202 v12" stroke="#ef4444" stroke-width="2"/>
    <text x="198" y="226" text-anchor="middle" font-size="11.5" fill="#b91c1c" font-weight="600">anonymous, attacker-reachable</text>

    <rect x="28" y="248" width="844" height="52" rx="7" fill="#fff" stroke="#e2e8f0"/>
    <text x="44" y="270" font-size="11.5" fill="#475569" font-weight="600">Rollback restores availability and restores the abuse.</text>
    <text x="44" y="288" font-size="11.5" fill="#64748b">
      For every control, state the degraded posture: what still defends this boundary while the control is off.
    </text>
  </g>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
